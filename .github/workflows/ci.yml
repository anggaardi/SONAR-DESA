# CI is the merge gate (A18). Same checks as `make lint` and `make test` (PRD Arsitektur M0-04, F0-2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (Pint, Larastan, Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonar_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sonar -d testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: sonar
      DB_PASSWORD: sonar_ci_only
    steps:
      - uses: actions/checkout@v7

      # Same PHP and extensions as docker/php/Dockerfile (base stage).
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath, gd, intl, zip, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # .env must exist before composer install: its post-autoload-dump runs `artisan package:discover`,
      # and without .env APP_ENV falls back to production, where AppServiceProvider stops boot.
      - run: cp .env.example .env
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php artisan key:generate --ansi

      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: php artisan test --compact

  js:
    name: JS (ESLint, Prettier, vue-tsc, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: sh scripts/check-neutral-language.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Catches broken imports in pages that tests do not render.
      - run: npm run build

  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CLI from the official image instead of gitleaks-action, which needs a license for organisations.
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose --exit-code 1 /repo
