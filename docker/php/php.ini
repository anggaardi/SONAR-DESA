; Shared by dev and prod (PRD Arsitektur 7.2).
; PHP defaults (2M / 8M) make a 10 MB RAB upload arrive as an empty request,
; so validation reports "file required" instead of "file too large".
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
max_execution_time = 90

; Store UTC; WITA is a display concern only (decision A14).
date.timezone = UTC

expose_php = Off
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
