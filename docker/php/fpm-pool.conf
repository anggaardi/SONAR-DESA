[www]
; Workers run as the unprivileged image user.
user = app
group = app
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Keep worker output (Laravel stderr logs) visible in `docker compose logs`.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
